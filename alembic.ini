# Alembic config for llm-gateway's usage table.
#
# There is deliberately no sqlalchemy.url here: the database URL comes from
# GATEWAY_DATABASE_URL at runtime (see migrations/env.py), the same variable the
# app reads. So a connection string is never committed, and migrations always
# target the database the service is actually using.
#
#   GATEWAY_DATABASE_URL=sqlite:///gateway.db alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
