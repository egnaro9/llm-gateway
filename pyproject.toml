[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgateway"
version = "0.1.0"
description = "A multi-provider LLM gateway (FastAPI): auth, rate limiting, caching, retries, and per-model cost accounting behind one OpenAI-shaped API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
keywords = ["llm", "gateway", "fastapi", "openai", "proxy", "rate-limiting", "observability"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
llmgateway = "llmgateway.cli:main"

[project.urls]
Homepage = "https://github.com/egnaro9/llm-gateway"

[tool.setuptools]
packages = ["llmgateway"]
