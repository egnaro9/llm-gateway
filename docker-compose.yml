services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      GATEWAY_API_KEYS: "dev-key,team-key"
      GATEWAY_RATE_CAPACITY: "120"
      GATEWAY_RATE_REFILL: "2.0"
      # To enable real providers, uncomment and supply keys:
      # OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
